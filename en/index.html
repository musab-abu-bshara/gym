  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<body class="bg-light">

  <!-- Start Top Bar  -->
  <header class="bg-warning text-dark">
    <div class="container d-flex justify-content-between ">
      <div id="phone">
        <i class="bi bi-telephone"></i>
        <span id="number">+1 (555) 123‑4567</span>
      </div>
      <div class="social d-flex justify-content-between gap-3">
        <a href="#" class="text-dark"><i class="bi bi-twitter-x"></i></a>
        <a href="#" class="text-dark"><i class="bi bi-linkedin"></i></a>
        <a href="#" class="text-dark"><i class="bi bi-github"></i></a>
      </div>
    </div>
  </header>
  <!-- End Top Bar  -->
  <!-- Start Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom">
  <div class="container">
    <a class="navbar-brand text-warning fw-bold" href="#">
      <img src="../assets/media/logo.png" width="40" height="40" alt="">
      Tiger Gym
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" 
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
        <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>

      <div class="d-flex gap-2">
        <button class="btn btn-outline-warning">العربية</button>
        <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#exampleModal">
          <i class="bi bi-send"></i> Get Membership
        </button>

        <div class="modal fade " id="exampleModal" tabindex="-1" data-bs-theme="dark" aria-labelledby="exampleModalLabel" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5 text-light" id="exampleModalLabel">Quick Membership</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <form>
                  <div class="mb-3 d-flex justify-content-between gap-2">
                    <input type="text" class="form-control" id="name" placeholder="Name" required>
                    <input type="number" class="form-control" id="age" placeholder="Age" required>
                  </div>
                  <div class="mb-1 d-flex justify-content-between gap-2">
                    <input type="tel" class="form-control" id="phone" placeholder="Phone" required>
                    <input type="email" class="form-control" id="email" placeholder="Email" required>
                  </div>
                  <div class="mb-3">
                    <label for="message-text" class="col-form-label text-light">Membership Type :</label>
                    <select name="membership-type" id="membership-type" class="form-select" aria-label="Default select example">
                      <option value="Monthly">Monthly - 100 NIC/month</option>
                      <option value="Quarterly">Quarterly - 270 NIC (Save 10%)</option>
                      <option value="Annual">Annual - 1140 NIC (Save 20%)</option>
                    </select>
                  </div>
                  <div class="mb-3 form-floating">
                    <textarea class="form-control min-vh-25" placeholder="Leave a comment here" id="floatingTextarea"></textarea>
                    <label for="floatingTextarea">Any questions</label>
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-warning w-100"><i class="bi bi-send"></i> Submit</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
